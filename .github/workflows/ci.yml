name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w widget
      - run: npm test -w widget
      - run: npm test -w functions
      - run: npm run build -w functions
      - run: npm run build -w widget # also prints the gzip bundle sizes
