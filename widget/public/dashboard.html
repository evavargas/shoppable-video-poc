<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Analítica de videos · Merece (demo)</title>
    <link rel="icon" href="/brand/merece-icon.png" />
    <link rel="stylesheet" href="/merece.css" />
    <script>try { if (localStorage.getItem('merece-demo-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}</script>
    <style>
      main.dash { padding-block: 1.5rem 3rem; }
      .dash header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.5rem 1rem; margin-bottom: 1.25rem; }
      .dash h1 { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 2.75rem); font-weight: 400; line-height: 1.1; }
      .meta { font-size: 0.875rem; color: var(--muted-fg); }
      .dash h2 { margin: 2rem 0 0.75rem; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-fg); }
      .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .card { padding: 1rem; border-radius: 0.9rem; background: var(--tile-card); color: var(--tile-fg); }
      .card .label { font-size: 0.8rem; color: var(--tile-muted); }
      .card .value { margin-top: 0.25rem; font-family: var(--font-display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .card .hint { margin-top: 0.15rem; font-size: 0.75rem; color: var(--tile-muted); }
      .card.key { background: var(--btn-accent); color: var(--on-color); }
      .card.key .label, .card.key .hint { color: var(--on-color); }
      .error { padding: 0.75rem 1rem; border: 2px solid var(--danger); border-radius: 0.9rem; font-weight: 700; }
      @media (min-width: 720px) { .cards { grid-template-columns: repeat(3, 1fr); } }
    </style>
  </head>
  <body>
    <main class="dash wrap">
      <header>
        <h1>Analítica de videos</h1>
        <span class="meta"><span id="updated">Cargando…</span> · <a href="/">Volver a la tienda</a></span>
      </header>
      <div id="out" aria-live="off"></div>
    </main>

    <script>
      // One block per embedding. Add ids here as new embeddings appear.
      const EMBEDDINGS = ['merece-demo', 'merece-stories', 'merece-live', 'home-carousel'];
      const REFRESH_MS = 5000;

      const KNOWN = ['views', 'clicks', 'storyOpens', 'addToCarts', 'addToCartValue', 'currency'];
      const pct = (a, b) => (b > 0 ? `${((a / b) * 100).toFixed(1)}%` : '–');
      const num = (n) => new Intl.NumberFormat('es-UY').format(n);
      const money = (v, cur) => new Intl.NumberFormat('es-UY', { style: 'currency', currency: cur || 'UYU' }).format(v);
      const label = (k) => k.replace(/([A-Z])/g, ' $1').replace(/_/g, ' ').replace(/^./, (c) => c.toUpperCase());

      const card = (name, value, hint, key) =>
        `<div class="card${key ? ' key' : ''}"><div class="label">${name}</div><div class="value">${value}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;

      function render(s) {
        // Any numeric field we don't know yet (new event types) still shows up, so the page keeps up with the backend.
        const opens = s.clicks + (s.storyOpens || 0); // carousel clicks and story opens are both "opened"
        const extra = Object.keys(s).filter((k) => !KNOWN.includes(k) && typeof s[k] === 'number');
        return `
          <h2>${s.embeddingId}</h2>
          <div class="cards">
            ${card('Vistas', num(s.views), 'videos reproducidos')}
            ${card('Aperturas', num(opens), 'videos o historias abiertos')}
            ${card('Agregados al carrito', num(s.addToCarts), 'desde el reproductor')}
            ${card('Valor en carrito', money(s.addToCartValue, s.currency), 'atribuido al video', true)}
            ${card('CTR', pct(opens, s.views), 'aperturas / vistas')}
            ${card('Tasa de carrito', pct(s.addToCarts, opens), 'agregados / aperturas')}
            ${extra.map((k) => card(label(k), num(s[k]))).join('')}
          </div>`;
      }

      async function refresh() {
        const out = document.getElementById('out');
        try {
          const all = await Promise.all(EMBEDDINGS.map((id) => fetch(`/api/stats?id=${encodeURIComponent(id)}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })));
          out.innerHTML = all.map(render).join('');
          document.getElementById('updated').textContent = `Actualizado ${new Date().toLocaleTimeString('es-UY')}`;
        } catch (e) {
          out.innerHTML = '<p class="error">No se pudieron cargar las estadísticas. ¿Está andando la API?</p>';
        }
      }
      refresh();
      setInterval(refresh, REFRESH_MS);
    </script>
  </body>
</html>
